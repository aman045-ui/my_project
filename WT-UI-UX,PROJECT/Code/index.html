<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR History Quiz Show</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="quiz-box text-center">

        <h1 class="title">🎮 VR History Quiz Show</h1>
        <p class="subtitle">Educational & Fun History Quiz</p>

        <button id="startBtn" class="btn btn-primary">Start Quiz</button>

        <!-- Quiz Section -->
        <div id="quiz" class="mt-4 d-none">

            <div class="d-flex justify-content-between mb-2">
                <span id="progress"></span>
                <span>Score: <b id="score">0</b></span>
            </div>

            <div class="progress mb-3">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <h4 id="question" class="mb-3"></h4>

            <div id="options" class="list-group"></div>

            <button id="nextBtn" class="btn btn-success mt-3 d-none">Next</button>

        </div>

        <!-- Result -->
        <div id="result" class="d-none">
            <h2>🎉 Quiz Completed!</h2>
            <h3>Your Score: <span id="finalScore"></span>/20</h3>
            <button onclick="location.reload()" class="btn btn-primary">Restart</button>
        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>

</body>
</html>
